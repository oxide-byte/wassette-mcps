services:
  postgres-db:
    build: .
    container_name: wasm-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wasmdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wasmdb"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgrest:
    image: postgrest/postgrest:latest
    container_name: wasm-postgrest
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres-db:5432/wasmdb
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
